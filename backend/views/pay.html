<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>开通科学计算器</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background: #f5f5f5;
      min-height: 100vh;
      padding: 20px;
    }
    .container {
      max-width: 400px;
      margin: 0 auto;
    }
    .card {
      background: white;
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 12px;
    }
    .title {
      font-size: 18px;
      color: #333;
      margin-bottom: 8px;
      text-align: center;
    }
    .subtitle {
      font-size: 14px;
      color: #999;
      text-align: center;
      margin-bottom: 24px;
    }
    .price-box {
      text-align: center;
      padding: 20px 0;
      border-top: 1px solid #eee;
      border-bottom: 1px solid #eee;
    }
    .price-label {
      font-size: 13px;
      color: #666;
      margin-bottom: 4px;
    }
    .price {
      font-size: 32px;
      color: #e64340;
      font-weight: 500;
    }
    .price small {
      font-size: 16px;
    }
    .methods {
      margin-top: 20px;
    }
    .method {
      display: flex;
      align-items: center;
      padding: 12px 16px;
      border: 1px solid #ddd;
      border-radius: 8px;
      margin-bottom: 10px;
      cursor: pointer;
    }
    .method.selected {
      border-color: #07c160;
      background: #f0fff4;
    }
    .method.selected.alipay {
      border-color: #1677ff;
      background: #e6f4ff;
    }
    .icon {
      width: 28px;
      height: 28px;
      margin-right: 12px;
      flex-shrink: 0;
    }
    .name {
      flex: 1;
      font-size: 15px;
      color: #333;
    }
    .radio {
      width: 16px;
      height: 16px;
      border: 1px solid #ddd;
      border-radius: 50%;
      position: relative;
      flex-shrink: 0;
    }
    .method.selected .radio {
      border-color: #07c160;
    }
    .method.selected.alipay .radio {
      border-color: #1677ff;
    }
    .method.selected .radio::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 8px;
      height: 8px;
      background: #07c160;
      border-radius: 50%;
    }
    .method.selected.alipay .radio::after {
      background: #1677ff;
    }
    .pay-btn {
      width: 100%;
      height: 44px;
      background: #07c160;
      color: white;
      border: none;
      border-radius: 22px;
      font-size: 16px;
      cursor: pointer;
      margin-top: 20px;
    }
    .pay-btn.alipay {
      background: #1677ff;
    }
    .pay-btn:active {
      opacity: 0.8;
    }
    .pay-btn:disabled {
      background: #ddd;
      cursor: not-allowed;
    }
    .loading {
      display: none;
    }
    .loading.active {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid white;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-right: 6px;
      vertical-align: middle;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .tips {
      font-size: 12px;
      color: #999;
      text-align: center;
      margin-top: 16px;
    }
    .success-card {
      text-align: center;
    }
    .success-icon {
      font-size: 48px;
      margin-bottom: 16px;
    }
    .success-title {
      font-size: 20px;
      color: #333;
      margin-bottom: 8px;
    }
    .success-desc {
      font-size: 14px;
      color: #999;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="card" id="payment-form">
      <h1 class="title">开通科学计算器</h1>
      <p class="subtitle">解锁全部高级计算功能</p>
      <div class="price-box">
        <div class="price-label">开通价格</div>
        <div class="price"><small>¥</small>0.50</div>
      </div>
      <div class="price-box" style="margin-top: 12px;">
        <div class="price-label">设备ID</div>
        <div class="price" style="font-size: 14px; color: #333; word-break: break-all;" id="deviceIdDisplay">未获取到设备ID</div>
      </div>
      <div class="methods">
        <div class="method selected" data-type="wxpay">
          <svg class="icon" viewBox="0 0 1024 1024" fill="#07c160">
            <path d="M669.3 369.4c9.8 0 19.6 0 29.4 1.6C671 245.2 536.9 152 383.2 152 211.6 152 71 269.7 71 416.8c0 85 45.8 156.9 124.2 210.9l-31.1 93.2L273.6 667c39.2 8.2 70.3 16.3 109.5 16.3 9.8 0 19.6 0 31.1-1.6-6.5-21.3-9.8-42.5-9.8-65.4 0.1-135.7 116.2-246.9 264.9-246.9z m-168.4-85c24.5 0 39.2 16.3 39.2 39.2 0 22.9-16.3 39.2-39.2 39.2-24.5 0-47.4-16.4-47.4-39.2 0-24.5 24.6-39.2 47.4-39.2z m-216.3 73.1c-24.7 0-47.8-16.2-47.8-38.8 0-24.3 24.7-38.8 47.8-38.8s39.5 16.2 39.5 38.8c0.1 22.7-16.4 38.8-39.5 38.8z" fill="#24DB5A" p-id="3475"></path><path d="M953.8 613c0-125.9-124.2-227.2-264.8-227.2-148.8 0-266.5 103-266.5 227.2 0 125.9 117.7 227.2 266.5 227.2 31.1 0 62.1-8.2 93.2-16.3l85 47.4-22.9-78.5c62.1-47.4 109.5-109.5 109.5-179.8z m-351.5-39.2c-14.7 0-31.1-14.7-31.1-31.1 0-14.7 16.3-31.1 31.1-31.1 22.9 0 39.2 16.3 39.2 31.1 0 16.4-14.7 31.1-39.2 31.1z m178-7.6c-14.8 0-31.3-14.6-31.3-30.7 0-14.6 16.5-30.7 31.3-30.7 23.1 0 39.5 16.2 39.5 30.7 0 16.2-16.4 30.7-39.5 30.7z" fill="#24DB5A" p-id="3476"></path>
          </svg>
          <div class="name">微信支付</div>
          <div class="radio"></div>
        </div>
        <div class="method" data-type="alipay">
          <svg class="icon" viewBox="0 0 1024 1024" fill="#1677ff">
            <path d="M1023.909365 696.920986l-329.367451-110.762867a572.003781 572.003781 0 0 0 52.339822-112.178271 524.241435 524.241435 0 0 0 30.897961-115.069309l-213.214002-1.746668V284.345868l258.205771-1.806898V231.072482h-258.115426V113.895126h-126.482883V231.072482h-240.919778v51.466488l240.919778-1.716554v78.118238H244.92538v40.775672h397.728437a382.460146 382.460146 0 0 1-19.634961 74.293637c-15.238176 41.197282-30.958191 77.244904-30.958192 77.244903s-186.712827-65.34949-285.158671-65.349489-218.092628 39.540958-229.686893 154.279002 55.742813 176.805001 150.574861 199.662265a376.437152 376.437152 0 0 0 258.597266-37.55337 600.884039 600.884039 0 0 0 151.026585-121.965637l383.845435 186.411677a189.423175 189.423175 0 0 1-186.863402 157.2905H189.724636a189.423175 189.423175 0 0 1-189.724324-189.242485V189.694511a189.423175 189.423175 0 0 1 189.242485-189.724325H834.3055A189.423175 189.423175 0 0 1 1024.029825 189.212671v507.587856z m-480.002541-64.175005s-119.827474 151.267505-261.006464 151.267505-170.902467-71.884438-170.902467-123.471386 29.362098-107.8116 149.550952-115.912528 282.418209 88.236868 282.418209 88.236869z" fill="#1678FF" p-id="1582"></path>
          </svg>
          <div class="name">支付宝</div>
          <div class="radio"></div>
        </div>
      </div>
      <button class="pay-btn" id="payBtn">
        <span class="loading" id="loading"></span>
        <span id="btnText">立即支付</span>
      </button>
      <p class="tips">支付完成后请返回手表查看</p>
    </div>

    <div class="card success-card" id="success-card" style="display: none;">
      <div class="success-icon">✅</div>
      <h2 class="success-title">支付成功</h2>
      <p class="success-desc">请返回手表应用使用</p>
    </div>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const deviceId = urlParams.get('deviceId');
    let selectedMethod = 'wxpay';

    // 显示设备ID
    if (deviceId) {
      document.getElementById('deviceIdDisplay').textContent = deviceId;
    }

    const methods = document.querySelectorAll('.method');
    const payBtn = document.getElementById('payBtn');
    const loading = document.getElementById('loading');
    const btnText = document.getElementById('btnText');
    const paymentForm = document.getElementById('payment-form');
    const successCard = document.getElementById('success-card');

    methods.forEach(method => {
      method.addEventListener('click', () => {
        methods.forEach(m => {
          m.classList.remove('selected');
          m.classList.remove('alipay');
        });
        method.classList.add('selected');
        if (method.dataset.type === 'alipay') {
          method.classList.add('alipay');
        }
        selectedMethod = method.dataset.type;
        updatePayBtn();
      });
    });

    function updatePayBtn() {
      payBtn.classList.remove('alipay');
      if (selectedMethod === 'alipay') {
        payBtn.classList.add('alipay');
      }
    }

    payBtn.addEventListener('click', async () => {
      if (!deviceId) {
        alert('缺少设备ID，请重新扫码');
        return;
      }

      payBtn.disabled = true;
      loading.classList.add('active');
      btnText.textContent = '处理中...';

      try {
        const response = await fetch('https://calculator.666-114514.eu.org/api/create-order', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({
            deviceId: deviceId,
            payMethod: selectedMethod
          }),
        });

        const result = await response.json();

        if (result.success && result.data.codeUrl) {
          showQRCode(result.data.codeUrl);
        } else {
          alert(result.message || '创建订单失败，请重试');
          resetButton();
        }
      } catch (error) {
        console.error('Error:', error);
        alert('网络错误，请重试');
        resetButton();
      }
    });

    function showQRCode(codeUrl) {
      paymentForm.innerHTML = `
        <h1 class="title">请扫码支付</h1>
        <p class="subtitle">使用${selectedMethod === 'wxpay' ? '微信' : '支付宝'}扫描下方二维码</p>
        <div style="text-align: center; margin: 20px 0;">
          <img src="${codeUrl}" alt="支付二维码" style="width: 200px; height: 200px; border-radius: 8px;" />
        </div>
        <p class="tips" id="status-text">正在等待支付...</p>
      `;
      startPolling();
    }

    function startPolling() {
      const pollInterval = setInterval(async () => {
        try {
          const response = await fetch(`https://calculator.666-114514.eu.org/api/check-payment?deviceId=${encodeURIComponent(deviceId)}`);
          const result = await response.json();

          if (result.success && result.data.isPaid) {
            clearInterval(pollInterval);
            showSuccess();
          }
        } catch (error) {
          console.error('Polling error:', error);
        }
      }, 2000);

      setTimeout(() => {
        clearInterval(pollInterval);
        document.getElementById('status-text').textContent = '支付超时，请重新扫码';
      }, 180000);
    }

    function showSuccess() {
      paymentForm.style.display = 'none';
      successCard.style.display = 'block';
    }

    function resetButton() {
      payBtn.disabled = false;
      loading.classList.remove('active');
      btnText.textContent = '立即支付';
    }
  </script>
</body>
</html>
